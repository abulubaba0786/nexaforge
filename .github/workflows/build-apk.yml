name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android Scaffold & Build APK
        run: |
          cd app
          if [ ! -d "android" ]; then
            echo "Scaffolding missing native platforms..."
            flutter create . --platforms=android --org=com.nexaforge
          fi
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaforge-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
